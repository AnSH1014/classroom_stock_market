<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우리 반 주식시장</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root {
  --bg:#0a0e1a; --panel:#111827; --panel2:#1a2235; --border:#1e2d45;
  --up:#00e896; --down:#ff4466; --flat:#6b7a9a;
  --gold:#f5c842; --text:#e8edf8; --muted:#6b7a9a; --accent:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;padding-bottom:80px}

/* JOIN SCREEN */
#join-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:20px}
.join-logo{font-family:'Black Han Sans',sans-serif;font-size:28px;color:var(--gold);letter-spacing:2px;text-align:center}
.join-logo small{display:block;font-size:12px;font-family:'Noto Sans KR',sans-serif;color:var(--muted);font-weight:300;letter-spacing:1px;margin-top:4px}
.join-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.join-input{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:18px;color:var(--text);font-family:'Noto Sans KR',sans-serif;width:100%;text-align:center;font-weight:700;outline:none}
.join-input:focus{border-color:var(--gold)}
.join-btn{background:var(--gold);color:#000;border:none;border-radius:10px;padding:16px;font-size:16px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;width:100%;letter-spacing:1px}
.join-btn:active{opacity:0.85}

/* MAIN */
#main-screen{display:none}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar-name{font-weight:700;font-size:14px}
.topbar-cash{font-family:'Black Han Sans',sans-serif;font-size:18px;color:var(--gold)}
.topbar-timer{font-family:'Black Han Sans',sans-serif;font-size:16px;color:var(--text);min-width:54px;text-align:right}
.topbar-timer.urgent{color:var(--down);animation:pulse .5s ease infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.4}}

/* STATUS BAR */
.status-bar{padding:8px 16px;font-size:12px;text-align:center;background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted)}
.status-bar.live{color:var(--up)}
.status-bar.ended{color:var(--down)}

/* NEWS */
.news-strip{background:rgba(245,200,66,.08);border-bottom:1px solid rgba(245,200,66,.2);padding:8px 16px;font-size:12px;color:var(--gold);display:none}

/* PORTFOLIO SUMMARY */
.portfolio-bar{display:flex;gap:0;border-bottom:1px solid var(--border)}
.portfolio-item{flex:1;padding:12px 10px;text-align:center;background:var(--panel)}
.portfolio-item:not(:last-child){border-right:1px solid var(--border)}
.portfolio-label{font-size:10px;color:var(--muted);margin-bottom:3px;letter-spacing:1px}
.portfolio-val{font-size:16px;font-weight:700}
.portfolio-val.up{color:var(--up)}
.portfolio-val.down{color:var(--down)}

/* STOCKS */
.stocks-list{padding:12px;display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:768px){.stocks-list{grid-template-columns:1fr 1fr}}
.stock-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .3s;margin-bottom:0}
.stock-item.flash-up{animation:fup .5s ease}
.stock-item.flash-down{animation:fdn .5s ease}
@keyframes fup{0%{background:rgba(0,232,150,.2)}100%{background:var(--panel)}}
@keyframes fdn{0%{background:rgba(255,68,102,.2)}100%{background:var(--panel)}}

.stock-main{display:flex;align-items:center;padding:12px 14px;gap:12px}
.stock-emoji-big{font-size:28px;line-height:1}
.stock-info{flex:1}
.stock-name-row{display:flex;align-items:center;gap:6px}
.sname{font-size:14px;font-weight:700}
.scode{font-size:10px;color:var(--muted);background:var(--panel2);padding:2px 6px;border-radius:4px}
.stock-price-row{margin-top:3px;display:flex;align-items:baseline;gap:6px}
.sprice{font-family:'Black Han Sans',sans-serif;font-size:22px}
.schange{font-size:11px;font-weight:700}
.schange.up{color:var(--up)}
.schange.down{color:var(--down)}
.schange.flat{color:var(--muted)}
.stock-right{text-align:right}
.held-badge{font-size:11px;color:var(--muted);background:var(--panel2);padding:3px 8px;border-radius:20px;margin-bottom:4px;display:inline-block}
.held-badge.has{color:var(--gold);border:1px solid rgba(245,200,66,.3)}

/* Sparkline */
.spark-wrap{padding:0 14px 8px;height:64px}
.spark-wrap svg{width:100%;height:100%}

/* Trade row */
.trade-row{display:flex;align-items:center;border-top:1px solid var(--border);overflow:hidden}
.qty-ctrl{display:flex;align-items:center;gap:0;padding:0 10px;gap:6px}
.qty-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;width:28px;height:28px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.qty-label{font-size:13px;font-weight:700;min-width:28px;text-align:center}
.trade-btn{flex:1;padding:12px 0;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;border:none;cursor:pointer;letter-spacing:1px}
.trade-btn.buy{background:rgba(0,232,150,.15);color:var(--up);border-left:1px solid var(--border)}
.trade-btn.sell{background:rgba(255,68,102,.15);color:var(--down);border-left:1px solid var(--border)}
.trade-btn:active{opacity:.7}
.trade-btn:disabled{opacity:.3;cursor:not-allowed}

/* LEADERBOARD TAB */
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:53px;z-index:99}
.tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--gold);border-color:var(--gold)}

.tab-panel{display:none}
.tab-panel.active{display:block}

.rank-list{padding:12px}
.rank-item{display:flex;align-items:center;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;gap:10px}
.rank-num{font-family:'Black Han Sans',sans-serif;font-size:18px;color:var(--muted);width:28px}
.rank-num.gold{color:#f5c842}
.rank-num.silver{color:#a0aec0}
.rank-num.bronze{color:#b87333}
.rank-name{flex:1;font-weight:700;font-size:14px}
.rank-asset{font-family:'Black Han Sans',sans-serif;font-size:16px;color:var(--up)}
.rank-me{border-color:var(--gold) !important}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{opacity:1}
.toast.err{border-color:var(--down);color:var(--down)}
.toast.ok{border-color:var(--up);color:var(--up)}

/* WAITING */
.waiting-screen{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:2}
.waiting-screen .w-emoji{font-size:48px;margin-bottom:12px}

/* END SCREEN */
.end-card{margin:16px;background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:24px;text-align:center}
.end-title{font-family:'Black Han Sans',sans-serif;font-size:22px;color:var(--gold);margin-bottom:4px}
.end-asset{font-family:'Black Han Sans',sans-serif;font-size:32px;margin:16px 0}
.end-asset.profit{color:var(--up)}
.end-asset.loss{color:var(--down)}
</style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen">
  <div class="join-logo">📈 우리 반 주식시장<small>CLASSROOM STOCK EXCHANGE</small></div>
  <div class="join-card">
    <div style="font-size:13px;color:var(--muted);text-align:center">이름을 입력하고 입장하세요!</div>
    <input class="join-input" id="name-input" placeholder="홍길동" maxlength="8" autofocus>
    <button class="join-btn" onclick="joinGame()">📈 입장하기</button>
  </div>
  <div style="font-size:11px;color:var(--muted);text-align:center;line-height:1.8">초기 투자금: <strong style="color:var(--gold)">3,000원</strong><br>주식을 사고팔아 가장 많은 돈을 벌어보세요!</div>
</div>

<!-- MAIN -->
<div id="main-screen">
  <div class="topbar">
    <div>
      <div class="topbar-name" id="my-name">—</div>
      <div style="font-size:10px;color:var(--muted)">내 현금</div>
    </div>
    <div class="topbar-cash" id="my-cash">3,000원</div>
    <div class="topbar-timer" id="timer-el">—</div>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('market')">📈 시세</div>
    <div class="tab" onclick="switchTab('rank')">🏆 순위</div>
  </div>

  <div class="status-bar" id="status-bar">대기 중 — 선생님이 시작하면 거래를 시작할 수 있어요</div>
  <div class="news-strip" id="news-strip"></div>

  <!-- MARKET TAB -->
  <div class="tab-panel active" id="tab-market">
    <div class="portfolio-bar">
      <div class="portfolio-item">
        <div class="portfolio-label">현금</div>
        <div class="portfolio-val" id="port-cash">3,000</div>
      </div>
      <div class="portfolio-item">
        <div class="portfolio-label">주식 평가액</div>
        <div class="portfolio-val" id="port-stock">0</div>
      </div>
      <div class="portfolio-item">
        <div class="portfolio-label">총 자산</div>
        <div class="portfolio-val up" id="port-total">3,000</div>
      </div>
    </div>

    <div id="waiting-msg" class="waiting-screen">
      <div class="w-emoji">⏳</div>
      선생님이 시장을 열면<br>여기에 주식 시세가 나타납니다!<br><br>
      <strong style="color:var(--gold)">초기 투자금 3,000원</strong>으로<br>가장 많이 버는 사람이 승리!
    </div>

    <div class="stocks-list" id="stocks-list" style="display:none"></div>
  </div>

  <!-- RANK TAB -->
  <div class="tab-panel" id="tab-rank">
    <div class="rank-list" id="rank-list">
      <div style="text-align:center;color:var(--muted);padding:40px;font-size:13px">게임 시작 후 순위가 표시됩니다</div>
    </div>
  </div>

  <!-- END SCREEN overlay -->
  <div id="end-section" style="display:none">
    <div class="end-card" id="end-card"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const socket = io();
let myName = '';
let myCash = 3000;
let myHoldings = {};
let stocks = [];
let gameRunning = false;
let qty = {};  // stockId -> selected qty for trading
const INITIAL_CASH = 3000;

function joinGame() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { showToast('이름을 입력해주세요!', 'err'); return; }
  socket.emit('student_join', name);
}

socket.on('joined', (data) => {
  myName = data.name;
  myCash = data.cash;
  myHoldings = {};
  stocks = data.stocks;
  gameRunning = data.gameState.running;

  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  document.getElementById('my-name').textContent = myName;

  if (gameRunning) {
    showMarket();
    updateTimerDisplay(data.gameState.timeLeft);
  }
  updatePortfolio();
});

socket.on('game_started', () => {
  gameRunning = true;
  document.getElementById('status-bar').textContent = '🟢 거래 중!';
  document.getElementById('status-bar').className = 'status-bar live';
  showMarket();
  showToast('📈 거래 시작!', 'ok');
});

socket.on('game_paused', () => {
  gameRunning = false;
  document.getElementById('status-bar').textContent = '⏸ 일시정지';
  document.getElementById('status-bar').className = 'status-bar';
  showToast('⏸ 일시정지', '');
});

socket.on('timer', (t) => updateTimerDisplay(t));

socket.on('prices', (updates) => {
  updates.forEach(u => {
    const s = stocks.find(s => s.id === u.id);
    if (s) { s.prevPrice = s.price; s.price = u.price; s.history = u.history; }
  });
  renderStocks();
  updatePortfolio();
});

socket.on('news', (text) => {
  const el = document.getElementById('news-strip');
  el.textContent = '📰 ' + text;
  el.style.display = 'block';
});

socket.on('portfolio', (data) => {
  myCash = data.cash;
  myHoldings = data.holdings;
  updatePortfolio();
  renderStocks();
});

socket.on('error_msg', (msg) => showToast(msg, 'err'));

socket.on('leaderboard', (lb) => renderLeaderboard(lb));

socket.on('game_ended', (data) => {
  gameRunning = false;
  document.getElementById('status-bar').textContent = '🔴 거래 종료';
  document.getElementById('status-bar').className = 'status-bar ended';
  showEndScreen(data);
});

socket.on('game_reset', (data) => {
  myCash = INITIAL_CASH;
  myHoldings = {};
  stocks.forEach(s => {
    const u = data.stocks.find(u => u.id === s.id);
    if (u) { s.price = u.price; s.history = u.history; s.prevPrice = u.price; }
  });
  gameRunning = false;
  document.getElementById('status-bar').textContent = '대기 중 — 선생님이 시작하면 거래를 시작할 수 있어요';
  document.getElementById('status-bar').className = 'status-bar';
  document.getElementById('end-section').style.display = 'none';
  document.getElementById('waiting-msg').style.display = 'block';
  document.getElementById('stocks-list').style.display = 'none';
  updatePortfolio();
  showToast('🔄 게임 초기화!', 'ok');
});

function showMarket() {
  document.getElementById('waiting-msg').style.display = 'none';
  document.getElementById('stocks-list').style.display = 'block';
  renderStocks();
}

function renderStocks() {
  const list = document.getElementById('stocks-list');
  if (!stocks.length) return;
  list.innerHTML = stocks.map(s => {
    const prev = s.prevPrice || s.price;
    const diff = s.price - prev;
    const pct = ((diff/prev)*100).toFixed(1);
    const held = myHoldings[s.id] || 0;
    const q = qty[s.id] || 1;
    const canBuy = gameRunning && myCash >= s.price;
    const canSell = gameRunning && held > 0;

    let chClass='flat', chText='— 0원 (0.0%)';
    if (diff>0){ chClass='up'; chText=`▲ +${diff}원 (+${pct}%)` }
    else if (diff<0){ chClass='down'; chText=`▼ ${diff}원 (${pct}%)` }

    const spark = sparkSvg(s.history, s.initialPrice);

    return `<div class="stock-item" id="si-${s.id}">
      <div class="stock-main">
        <div class="stock-emoji-big">${s.emoji}</div>
        <div class="stock-info">
          <div class="stock-name-row">
            <span class="sname">${s.name}</span>
            <span class="scode">${s.code}</span>
          </div>
          <div class="stock-price-row">
            <span class="sprice" style="color:${s.color}">${s.price.toLocaleString()}원</span>
            <span class="schange ${chClass}">${chText}</span>
          </div>
        </div>
        <div class="stock-right">
          <div class="held-badge ${held>0?'has':''}">보유 ${held}주</div>
        </div>
      </div>
      <div class="spark-wrap">${spark}</div>
      <div class="trade-row">
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${s.id}',-1)">−</button>
          <span class="qty-label" id="qty-${s.id}">${q}</span>
          <button class="qty-btn" onclick="changeQty('${s.id}',1)">+</button>
        </div>
        <button class="trade-btn buy" onclick="doBuy('${s.id}')" ${canBuy?'':'disabled'}>▲ 매수 (${(s.price*q).toLocaleString()}원)</button>
        <button class="trade-btn sell" onclick="doSell('${s.id}')" ${canSell?'':'disabled'}>▼ 매도 (${(s.price*q).toLocaleString()}원)</button>
      </div>
    </div>`;
  }).join('');
}

function sparkSvg(history, initialPrice) {
  const h = history||[];
  if (h.length < 2) return '<svg viewBox="0 0 240 64" preserveAspectRatio="none"></svg>';
  const W=240, H=64, pad=5;
  const startVal = initialPrice || h[0];
  const allVals = [startVal, ...h];
  const min = Math.min(...allVals)*0.995;
  const max = Math.max(...allVals)*1.005;
  const range = max-min||1;
  const toY = v => H - ((v-min)/range)*(H-pad*2) - pad;
  const baseY = toY(startVal);
  const pts = h.map((v,i)=>`${(i/(h.length-1||1))*W},${toY(v)}`).join(' ');
  const c = h[h.length-1] >= startVal ? '#00e896' : '#ff4466';
  const fillPts = `0,${baseY} ${pts} ${W},${baseY}`;
  const gridLines = [0.2,0.5,0.8].map(r=>{
    const gv=min+range*(1-r), gy=toY(gv);
    return `<line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
            <text x="3" y="${gy-2}" font-size="8" fill="rgba(255,255,255,0.3)" font-family="sans-serif">${Math.round(gv).toLocaleString()}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="overflow:hidden">
    ${gridLines}
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="${c}" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.5"/>
    <polygon points="${fillPts}" fill="${c}" opacity="0.08"/>
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${W}" cy="${toY(h[h.length-1])}" r="2.5" fill="${c}"/>
  </svg>`;
}

function changeQty(stockId, delta) {
  qty[stockId] = Math.max(1, Math.min(10, (qty[stockId]||1) + delta));
  const el = document.getElementById('qty-'+stockId);
  if (el) el.textContent = qty[stockId];
  // update button labels
  const s = stocks.find(s=>s.id===stockId);
  if (!s) return;
  const q = qty[stockId];
  const buyBtn = document.querySelector(`#si-${stockId} .trade-btn.buy`);
  const sellBtn = document.querySelector(`#si-${stockId} .trade-btn.sell`);
  if (buyBtn) buyBtn.textContent = `▲ 매수 (${(s.price*q).toLocaleString()}원)`;
  if (sellBtn) sellBtn.textContent = `▼ 매도 (${(s.price*q).toLocaleString()}원)`;
}

function doBuy(stockId) {
  socket.emit('buy', { stockId, qty: qty[stockId]||1 });
  const s = stocks.find(s=>s.id===stockId);
  if (s) showToast(`✅ ${s.emoji} ${s.name} ${qty[stockId]||1}주 매수!`, 'ok');
}

function doSell(stockId) {
  socket.emit('sell', { stockId, qty: qty[stockId]||1 });
  const s = stocks.find(s=>s.id===stockId);
  if (s) showToast(`💰 ${s.emoji} ${s.name} ${qty[stockId]||1}주 매도!`, 'ok');
}

function calcTotal() {
  let stockVal = 0;
  for (const [sid, q] of Object.entries(myHoldings)) {
    const s = stocks.find(s=>s.id===sid);
    if (s) stockVal += s.price * q;
  }
  return { stockVal, total: myCash + stockVal };
}

function updatePortfolio() {
  const { stockVal, total } = calcTotal();
  document.getElementById('my-cash').textContent = myCash.toLocaleString()+'원';
  document.getElementById('port-cash').textContent = myCash.toLocaleString();
  document.getElementById('port-stock').textContent = stockVal.toLocaleString();
  const totalEl = document.getElementById('port-total');
  totalEl.textContent = total.toLocaleString();
  totalEl.className = 'portfolio-val ' + (total >= INITIAL_CASH ? 'up' : 'down');
}

function renderLeaderboard(lb) {
  const numClass = ['gold','silver','bronze'];
  document.getElementById('rank-list').innerHTML = lb.map((item,i) => `
    <div class="rank-item ${item.name===myName?'rank-me':''}">
      <div class="rank-num ${numClass[i]||''}">${i+1}</div>
      <div class="rank-name">${item.name} ${item.name===myName?'<span style="color:var(--gold);font-size:10px">나</span>':''}</div>
      <div class="rank-asset">${item.asset.toLocaleString()}원</div>
    </div>
  `).join('') || '<div style="text-align:center;color:var(--muted);padding:40px;font-size:13px">아직 참가자가 없어요</div>';
}

function showEndScreen(data) {
  const { total } = calcTotal();
  const profit = total - INITIAL_CASH;
  document.getElementById('end-section').style.display = 'block';
  document.getElementById('end-card').innerHTML = `
    <div class="end-title">🔔 거래 종료!</div>
    <div style="color:var(--muted);font-size:13px;margin-top:4px">${myName}님의 최종 결과</div>
    <div class="end-asset ${profit>=0?'profit':'loss'}">${total.toLocaleString()}원</div>
    <div style="font-size:14px;color:${profit>=0?'var(--up)':'var(--down)'}">
      ${profit>=0?'▲ +':'▼ '}${profit.toLocaleString()}원 (${((profit/INITIAL_CASH)*100).toFixed(1)}%)
    </div>
    <div style="margin-top:16px;font-size:12px;color:var(--muted)">이 돈으로 이제 경매에 참여하세요!</div>
  `;
  showToast('⏰ 거래가 종료되었습니다!', '');
}

function updateTimerDisplay(t) {
  const m = Math.floor(t/60).toString().padStart(2,'0');
  const s = (t%60).toString().padStart(2,'0');
  const el = document.getElementById('timer-el');
  el.textContent = `${m}:${s}`;
  el.className = t<=30&&t>0 ? 'topbar-timer urgent' : 'topbar-timer';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', ['market','rank'][i]===tab);
  });
  document.querySelectorAll('.tab-panel').forEach((p,i)=>{
    p.classList.toggle('active', ['market','rank'][i]===tab);
  });
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type||'');
  setTimeout(()=>{ el.className='toast'; }, 2200);
}
</script>
</body>
</html>
